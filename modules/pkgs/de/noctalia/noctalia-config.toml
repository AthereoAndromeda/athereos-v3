[audio]
enable_sounds = true

[backdrop]
blur_intensity = 0.5
enabled = true
tint_intensity = 0.3

[bar]
order = [ "Topbar" ]

    [bar.Topbar]
    background_opacity = 0.8
    capsule = true
    center = [ "clock", "audio_visualizer" ]
    color = "tertiary"
    end = [ "tray", "mail", "media", "privacy", "group:g1", "volume", "battery", "widget", "group:g3" ]
    icon_color = "primary"
    margin_edge = 5
    margin_ends = 50
    start = [ "launcher", "wallpaper", "workspaces", "bongocat", "group:g2", "group:g4", "nix-monitor", "bar", "cat" ]
    thickness = 25
    widget_spacing = 3

        [bar.Topbar.dead_zone.actions]
        left = "panel-toggle control-center hom"
        right = "settings-open"

        [[bar.Topbar.capsule_group]]
        accordion = false
        accordion_direction = "end"
        border = "primary"
        enabled = true
        fill = "on_primary"
        id = "g1"
        members = [ "bluetooth", "network" ]
        opacity = 1.0
        padding = 6.0

        [[bar.Topbar.capsule_group]]
        accordion = false
        accordion_direction = "end"
        border = "secondary"
        enabled = true
        fill = "surface"
        id = "g2"
        members = [ "cpu", "temp", "ram" ]
        opacity = 1.0
        padding = 6.0

        [[bar.Topbar.capsule_group]]
        accordion = false
        accordion_direction = "end"
        border = "tertiary"
        enabled = true
        fill = "surface"
        id = "g3"
        members = [ "status", "clipboard", "notifications", "control-center", "session" ]
        opacity = 1.0
        padding = 6.0
        widget_spacing = 5

        [[bar.Topbar.capsule_group]]
        accordion = false
        accordion_direction = "end"
        border = "error"
        enabled = true
        fill = "surface_variant"
        id = "g4"
        members = [ "nightlight", "caffeine" ]
        opacity = 1.0
        padding = 6.0

[battery]
warning_threshold = 20

    [battery.device."/org/freedesktop/UPower/devices/battery_hid_0018o056Ao52C6x0003_battery"]
    warning_threshold = 20

    [battery.device."/org/freedesktop/UPower/devices/headset_dev_86_C1_16_67_53_EE"]
    warning_threshold = 30

[calendar]
enabled = true

[control_center.calendar]
show_week_numbers = true

[[control_center.shortcuts]]
type = "caffeine"

[[control_center.shortcuts]]
type = "nightlight"

[[control_center.shortcuts]]
type = "notification"

[[control_center.shortcuts]]
type = "power_profile"

