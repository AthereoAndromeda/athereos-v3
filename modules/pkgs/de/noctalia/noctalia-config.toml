[notification]
background_opacity = 0.6

[plugins]
auto_update = "all"
enabled = [
    "noctalia/kaomoji",
    "avivbintangaringga/nix-monitor",
    "icefish/phone-connect",
    "aristides/udiskie",
    "lux/ideapad-conservation-mode",
    "noctalia/bongocat"
]

[shell]
avatar_path = "/home/athereo/.face"
font_family = "JetBrains Mono"
niri_overview_type_to_launch_enabled = true
password_style = "random"
polkit_agent = true
screen_time_enabled = true
settings_show_advanced = true
telemetry_enabled = false

    [shell.panel]
    open_near_click_control_center = true
    open_near_click_wallpaper = true
    session_placement = "centered"
    transparency_mode = "glass"

[theme]
community_palette = "Lilac AMOLED"
source = "community"

    [theme.templates]
    builtin_ids = [ "btop", "niri" ]
    community_ids = [ "discord", "obsidian", "zathura", "zellij", "bat", "lazygit" ]

[wallpaper]
directory = "/home/athereo/Pictures/Wallpapers"
transition_on_startup = true

    [wallpaper.automation]
    enabled = true

    [wallpaper.default]
    path = "/home/athereo/Pictures/Wallpapers/nix/canvas.png"

    [wallpaper.last]
    path = "/home/athereo/Pictures/Wallpapers/nix/canvas.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/athereo/Pictures/Wallpapers/nix/canvas.png"

    [wallpaper.monitors.winit]
    path = "/home/athereo/Pictures/Wallpapers/wallpaperflare.com_wallpaper-sunrise.jpg"

[widget.audio_visualizer]
color_2 = "error"

[widget.bar]
type = "icefish/phone-connect:bar"

[widget.battery]
color = "error"

[widget.bongocat]
script = "scripts/bongocat.lua"
type = "scripted"

[widget.cat]
audio_spectrum = true
input_devices = [ "/dev/input/event17" ]
rave_mode = true
scale = 1.2
tappy_mode = true
type = "noctalia/bongocat:cat"
use_mpris_filter = true

[widget.clock]
anchor = true
color = "tertiary"
font_weight = 700
format = "{:%b %d %a %H:%M}"
icon_color = "primary"
scale = 1.2

[widget.mail]
type = "mdj2812/thunderbird-companion:mail"

[widget.media]
art_size = 20.0
max_length = 180
title_scroll = "always"

[widget.network]
show_label = false

[widget.nix-monitor]
type = "avivbintangaringga/nix-monitor:nix-monitor"

[widget.privacy]
hide_inactive = true

[widget.status]
type = "aristides/udiskie:status"

[widget.sysmon]
stat = "cpu_temp"

[widget.tray]
detached_panel = true
drawer = true

[widget.widget]
type = "alexander/screen-toolkit:widget"

[widget.workspaces]
empty_color = "tertiary"
