[dock]
background_opacity = 0.6
border_width = 1.5
enabled = true
icon_size = 64
item_spacing = 10
launcher_icon = "noctalia"
launcher_position = "end"
main_axis_padding = 8
radius = 32
reserve_space = false
show_dots = true
smart_auto_hide = true

[hot_corners]
enabled = true

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = false
    timeout = 660

